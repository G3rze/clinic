spring:
  application:
    name: clinic
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  config:
    import: optional:.env

encryption:
  key: ${ENCRYPTION_KEY}

stripe:
  api:
    key: ${STRIPE_SECRET_KEY}
    base-url: ${STRIPE_BASE_URL}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}

google:
  api:
    base-url: ${GOOGLE_BASE_URL:https://www.googleapis.com}
    calendar-url: ${GOOGLE_CALENDAR_URL:https://calendar.googleapis.com}
    token-url: ${GOOGLE_TOKEN_URL:https://oauth2.googleapis.com}
  session:
    cleanup-interval-ms: ${GOOGLE_SESSION_CLEANUP_INTERVAL_MS:1800000}

app:
  base-uri: ${APP_BASE_URI:}
  stripe:
    enabled: ${STRIPE_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    same-site-policy: ${JWT_SAME_SITE_POLICY:Lax}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,X-Requested-With
      allow-credentials: true
      max-age: 3600
    oauth2:
      success-redirect-url: ${OAUTH2_SUCCESS_URL:/}
    employee:
      email-domain: ${EMPLOYEE_EMAIL_DOMAIN}
    patient:
      allowed-domains: ${PATIENT_EMAIL_DOMAINS:gmail.com}
      auto-create: true
    consent:
      version: ${CONSENT_VERSION:v1.0}
    user:
      anonymization-retention-days: 30

clinic:
  timezone: ${CLINIC_TIMEZONE:America/El_Salvador}

email:
  enabled: ${EMAIL_ENABLED:true}
  provider:
    type: ${EMAIL_PROVIDER:smtp}
  default-from: ${EMAIL_DEFAULT_FROM:noreply@terraplanistas.net}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    starttls: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    com.terraplanistas.clinic.http.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    defaults:
      enabled: true