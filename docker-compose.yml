services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - deploy.env
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../FrontEndNCapasTerraplanistas
      dockerfile: Dockerfile
    container_name: clinic-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - default

networks:
  default:
    name: clinic_default
